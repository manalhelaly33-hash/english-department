<!DOCTYPE html>
<html>

<head>

    <title>English Literature</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* الصورة الكبيرة */

        .home {
    width: 100%;
    height: 100vh;
    position: absolute;
}

.home img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    opacity: 0;
    animation: changeImage 16s infinite;
}

.home img:nth-child(1) {
    animation-delay: 0s;
}

.home img:nth-child(2) {
    animation-delay: 4s;
}

.home img:nth-child(3) {
    animation-delay: 8s;
}

.home img:nth-child(4) {
    animation-delay: 12s;
}

        /* حركة الصور */

        @keyframes changeImage {

            0% {
                opacity: 0;
                transform: scale(1);
            }

            10% {
                opacity: 1;
            }

            30% {
                opacity: 1;
                transform: scale(1.1);
            }

            40% {
                opacity: 0;
            }

            100% {
                opacity: 0;
            }

        }


        /* الخانة الموجودة على الجانب */

        .side-button {

            position: absolute;

            right: 30px;
            top: 50%;

            transform: translateY(-50%);

            background: white;

            padding: 18px 25px;

            border-radius: 10px;

            text-decoration: none;

            color: black;

            font-size: 20px;

            font-weight: bold;

            z-index: 5;

            transition: 0.3s;
        }


        .side-button:hover {

            background: black;

            color: white;

            transform: translateY(-50%) scale(1.1);

        }

    </style>

</head>


<body>

            <img src="images/WhatsApp Image 2026-10-04 at 6.50.41 PM copy.jpeg">
            <img src="images/WhatsApp Image 2026-10-04 at 6.50.41 PM.jpeg">
            <img src="images/WhatsApp Image 2026-10-04 at 6.51.10 PM.jpeg">
        
        </div>

            <a href="literature.html" class="side-button">
                Literature →
            </a>
        
        </div>

            Literature →

        </a>

    </div>


</body>

</html>
